<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrandLens AI</title><style>body{margin:0;background:#0c1020;color:#eaf0ff;font:16px system-ui}main{max-width:1100px;margin:auto;padding:32px}h1{font-size:36px}h2{color:#b8c7ff}.panel{background:#161e34;border:1px solid #303e60;padding:24px;border-radius:18px;margin:20px 0}input,select,textarea,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #4a5879;margin:5px;background:#0d1426;color:white}textarea{width:90%;min-height:100px}button{background:#6554d9;cursor:pointer}button:hover{background:#8675ee}.row{padding:14px;border-bottom:1px solid #34405b}.muted{color:#a5b3ce}#notice{white-space:pre-wrap;color:#ffd789}pre{white-space:pre-wrap}svg{width:100%;height:260px;background:#10182b}label{display:inline-block}</style><main><h1>BrandLens AI</h1><p class="muted">Gowtham E. · Local full-stack project</p><div id="notice" role="alert"></div><section id="login" class="panel"><h2>Sign in</h2><p>Use employee or manager and the first-run password printed in the terminal.</p><input id="username" aria-label="Username" value="employee"><input id="password" type="password" aria-label="Password" placeholder="Password"><button onclick="login()">Sign in</button></section><section id="app" class="panel" hidden><button onclick="logout()">Sign out</button><h2>Analyze customer reviews</h2><input id="brand" aria-label="Brand" placeholder="Brand name"><textarea id="reviews" aria-label="Reviews" placeholder="One English review per line"></textarea><button onclick="action('analyze',{brand:$('brand').value,reviews:$('reviews').value.split('\n').filter(x=>x.trim())})">Analyze and save</button><button onclick="$ ('brand').value='Demo Brand';$('reviews').value='Great quality and fast service\nPoor support and expensive product\nDelivery arrived today'">Load sample</button><h2>Brand comparison</h2><div id="brands"></div><h2>Review history</h2><div id="rows"></div><p id="model" class="muted"></p></section></main><script>let token=sessionStorage.getItem('token');const $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error);return j}async function run(fn){try{$('notice').textContent='';await fn()}catch(e){$('notice').textContent=e.message}}async function login(){await run(async()=>{let j=await api('login',{username:$('username').value,password:$('password').value});token=j.token;sessionStorage.setItem('token',token);await load()})}async function logout(){await run(async()=>{await api('logout',{});sessionStorage.removeItem('token');token=null;$('login').hidden=false;$('app').hidden=true})}async function load(){let d=await api('dashboard');$('login').hidden=true;$('app').hidden=false;render(d)}async function action(path,data){await run(async()=>{await api(path,data);await load()})}
function render(d){$('model').textContent=d.model;$('brands').innerHTML=Object.entries(d.brands).map(([name,b])=>`<div class="row"><strong>${esc(name)}</strong> · ${b.total} reviews · ${b.positive_percent}% positive<progress value="${b.positive_percent}" max="100"></progress><p>Positive ${b.Positive} / Neutral ${b.Neutral} / Negative ${b.Negative}</p></div>`).join('')||'Analyze reviews to compare brands.';$('rows').innerHTML=d.reviews.map(r=>`<div class="row"><strong>${esc(r.brand)} · ${esc(r.sentiment)}</strong><p>${esc(r.text)}</p><button onclick="action('delete',{id:${r.id}})">Delete</button></div>`).join('')}
if(token)run(load);</script></html>
